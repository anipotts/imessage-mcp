version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 6
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
        patterns: ["*"]
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 4
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
