name: dependabot auto-merge

# A workflow_run controller can receive the App key without exposing it to PR
# code. It uses only protected main and never consumes artifacts from the run.
on:
  workflow_run:
    workflows: [ci, security, codeql]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-maintenance
  cancel-in-progress: false

jobs:
  enable:
    name: enable dependabot auto-merge
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Controller code always comes from protected main, never a PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: mint repository-scoped installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: maintain protected Dependabot queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/dependabot-maintain.py
