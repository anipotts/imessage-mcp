name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-matrix:
    name: macos ${{ matrix.os-version }} arm64, node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os-version: [14, 15, 26]
        node-version: [22, 24, 26]
    runs-on: macos-${{ matrix.os-version }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npm run verify

  intel-package-smoke:
    name: macos 26 intel package smoke
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npm run build
      - run: npm run test:installed

  performance:
    name: million-message performance (macos 14, node 24)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npm run build
      - run: npm run test:performance
