name: maintenance health

on:
  schedule:
    - cron: "43 14 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/maintenance-health.yml
      - scripts/dependabot-health.py
      - CONTRIBUTING.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-health
  cancel-in-progress: false

jobs:
  health:
    name: dependency automation health
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Controller code always comes from protected main, never a PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: mint repository-scoped installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
      - name: check installation scope and stalled updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/dependabot-health.py
